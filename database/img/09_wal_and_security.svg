<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 465" width="920" height="465" font-family="Segoe UI, Roboto, DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="916" height="461" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="460" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Hình 6.1: Cơ chế nhật ký WAL (Write-Ahead Logging) và Hai nguyên tắc bảo mật cơ bản</text>

  <!-- WAL -->
  <rect x="28" y="52" width="864" height="172" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="460" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">1. Cơ chế nhật ký ghi trước (WAL): Đảm bảo đồng thời tốc độ bộ nhớ RAM và độ bền vững trên ổ cứng</text>

  <rect x="46" y="96" width="236" height="90" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="164" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Bước 1: Cập nhật trên RAM</text>
  <text x="164" y="142" text-anchor="middle" font-size="12" fill="#334155">(Vùng đệm Shared Buffers)</text>
  <text x="164" y="164" text-anchor="middle" font-size="12" fill="#1e40af">Thay đổi dữ liệu ở tốc độ bộ nhớ</text>
  <line x1="282" y1="141" x2="334" y2="141" stroke="#2563eb" stroke-width="2" marker-end="url(#arrW)"/>
  <text x="308" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">COMMIT</text>

  <rect x="338" y="96" width="256" height="90" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="466" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Bước 2: Ghi nối vào tệp WAL</text>
  <text x="466" y="142" text-anchor="middle" font-size="12" fill="#065f46">(Ghi tuần tự trên ổ đĩa — Rất nhanh)</text>
  <text x="466" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">Hoàn tất bước này mới báo COMMIT</text>
  <line x1="594" y1="141" x2="646" y2="141" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrS)"/>
  <text x="620" y="132" text-anchor="middle" font-size="11" fill="#047857">Checkpoint</text>

  <rect x="650" y="96" width="224" height="90" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="762" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Bước 3: Ghi xuống bảng chính</text>
  <text x="762" y="142" text-anchor="middle" font-size="12" fill="#334155">(Thư mục base/ trên ổ đĩa)</text>
  <text x="762" y="164" text-anchor="middle" font-size="12" fill="#92400e">Tiến trình nền đồng bộ theo chu kỳ</text>

  <text x="460" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#0f766e">Nếu mất điện sau Bước 2, khi khởi động lại PostgreSQL sẽ đọc lại nhật ký WAL để khôi phục đủ các giao dịch đã COMMIT.</text>

  <!-- Role Security -->
  <rect x="28" y="242" width="418" height="202" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="237" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">2. Nguyên tắc đặc quyền tối thiểu với ROLE</text>
  <rect x="46" y="284" width="382" height="40" rx="5" fill="#ffe4e6" stroke="#fda4af"/>
  <text x="60" y="309" font-size="12.5" fill="#9f1239"><tspan font-weight="700">postgres / admin:</tspan> Không đưa tài khoản quản trị vào ứng dụng</text>
  <rect x="46" y="334" width="382" height="44" rx="5" fill="#dcfce7" stroke="#6ee7b7"/>
  <text x="60" y="354" font-size="12.5" font-weight="700" fill="#065f46">app_backend (role_readwrite):</text>
  <text x="60" y="371" font-size="12" fill="#334155">Chỉ cấp SELECT, INSERT, UPDATE, DELETE (không cấp DROP)</text>
  <rect x="46" y="388" width="382" height="42" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="60" y="414" font-size="12.5" fill="#1e3a8a"><tspan font-weight="700">bi_viewer (role_readonly):</tspan> Chỉ cấp quyền đọc SELECT</text>

  <!-- Bcrypt -->
  <rect x="474" y="242" width="418" height="202" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
  <text x="683" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">3. Băm mật khẩu một chiều kết hợp Salt (bcrypt)</text>

  <rect x="492" y="288" width="130" height="42" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="557" y="314" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="700" fill="#be123c">'MatKhau123'</text>
  <text x="634" y="314" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">+</text>
  <rect x="646" y="288" width="114" height="42" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="703" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Chuỗi Salt</text>
  <text x="703" y="322" text-anchor="middle" font-size="10.5" fill="#92400e">Sinh ngẫu nhiên</text>

  <line x1="760" y1="309" x2="792" y2="309" stroke="#059669" stroke-width="2" marker-end="url(#arrS)"/>
  <rect x="796" y="288" width="78" height="42" rx="5" fill="#059669"/>
  <text x="835" y="314" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">bcrypt</text>

  <rect x="492" y="344" width="382" height="40" rx="5" fill="#1e293b"/>
  <text x="683" y="369" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#6ee7b7">Lưu trong bảng: "$2a$10$N9qo8uLOickgx2ZMR..."</text>

  <text x="492" y="408" font-size="12" fill="#334155">• <tspan font-weight="700" fill="#047857">Một chiều:</tspan> Không thể giải mã ngược từ chuỗi băm về mật khẩu gốc.</text>
  <text x="492" y="428" font-size="12" fill="#334155">• <tspan font-weight="700" fill="#047857">Có Salt:</tspan> Hai người dùng chung mật khẩu vẫn tạo ra 2 chuỗi băm khác nhau.</text>
</svg>
