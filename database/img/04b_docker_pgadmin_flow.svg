<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" width="920" height="265" font-family="Segoe UI, Roboto, DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="916" height="261" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="460" y="32" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">Hình 2.2: Kiến trúc triển khai PostgreSQL 16 và pgAdmin 4 bằng Docker Compose</text>

  <rect x="26" y="72" width="184" height="126" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="118" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">Trình duyệt Web</text>
  <text x="118" y="122" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#1e40af">localhost:5050</text>
  <text x="118" y="148" text-anchor="middle" font-size="12" fill="#475569">Giao diện đồ họa</text>
  <text x="118" y="168" text-anchor="middle" font-size="12" fill="#475569">quản trị bảng và truy vấn</text>

  <line x1="210" y1="135" x2="258" y2="135" stroke="#2563eb" stroke-width="2" marker-end="url(#arrD)"/>

  <rect x="262" y="52" width="420" height="176" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="472" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">Mạng nội bộ Docker Compose</text>

  <rect x="280" y="88" width="166" height="118" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="363" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">pgAdmin 4</text>
  <text x="363" y="134" text-anchor="middle" font-size="11.5" fill="#64748b">(Container giao diện)</text>
  <text x="363" y="158" text-anchor="middle" font-size="11.5" fill="#334155">Tên máy chủ kết nối:</text>
  <text x="363" y="178" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="700" fill="#2563eb">postgres</text>

  <line x1="446" y1="147" x2="494" y2="147" stroke="#2563eb" stroke-width="2" marker-end="url(#arrD)"/>
  <text x="470" y="138" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">:5432</text>

  <rect x="498" y="88" width="166" height="118" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="581" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">PostgreSQL 16</text>
  <text x="581" y="134" text-anchor="middle" font-size="11.5" fill="#065f46">DB: <tspan font-family="monospace" font-weight="700">appdb</tspan></text>
  <text x="581" y="156" text-anchor="middle" font-size="11.5" fill="#334155">User: <tspan font-family="monospace" font-weight="700">admin</tspan></text>
  <text x="581" y="178" text-anchor="middle" font-size="11.5" fill="#334155">Cổng máy chủ: <tspan font-family="monospace" font-weight="700">5432</tspan></text>

  <line x1="664" y1="147" x2="716" y2="147" stroke="#059669" stroke-width="2" marker-end="url(#arrV)"/>

  <rect x="720" y="72" width="174" height="126" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="807" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309">Volume: pgdata</text>
  <text x="807" y="122" text-anchor="middle" font-size="12" fill="#334155">Lưu bền vững trên đĩa</text>
  <text x="807" y="148" text-anchor="middle" font-size="11.5" font-weight="600" fill="#047857">Dữ liệu được bảo toàn</text>
  <text x="807" y="166" text-anchor="middle" font-size="11.5" font-weight="600" fill="#047857">khi dừng container</text>
