<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 435" width="920" height="435" font-family="Segoe UI, Roboto, DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrIdx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="916" height="431" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="460" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Hình 5.1: So sánh tìm kiếm bản ghi id = 85 trong bảng 10 triệu dòng (Không Index và Có B-Tree Index)</text>

  <!-- Left: Seq Scan -->
  <rect x="28" y="56" width="416" height="356" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.6"/>
  <rect x="28" y="56" width="416" height="38" rx="8" fill="#ffe4e6"/>
  <text x="236" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">Không có Index (Seq Scan — Quét tuần tự)</text>

  <rect x="68" y="110" width="336" height="34" rx="5" fill="#ffffff" stroke="#fda4af"/>
  <text x="236" y="132" text-anchor="middle" font-size="13" fill="#475569">Đọc dòng 1 (id = 1)  →  Không khớp</text>

  <rect x="68" y="154" width="336" height="34" rx="5" fill="#ffffff" stroke="#fda4af"/>
  <text x="236" y="176" text-anchor="middle" font-size="13" fill="#475569">Đọc dòng 2 (id = 2)  →  Không khớp</text>

  <rect x="68" y="198" width="336" height="34" rx="5" fill="#ffffff" stroke="#fda4af"/>
  <text x="236" y="220" text-anchor="middle" font-size="13" fill="#475569">Đọc dòng 3 (id = 3)  →  Không khớp</text>

  <text x="236" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#be123c">... Tiếp tục duyệt tuần tự qua hàng triệu dòng ...</text>

  <rect x="68" y="276" width="336" height="34" rx="5" fill="#ffffff" stroke="#fda4af"/>
  <text x="236" y="298" text-anchor="middle" font-size="13" fill="#475569">Đọc đến dòng 10.000.000  →  Kết thúc</text>

  <rect x="54" y="330" width="364" height="64" rx="6" fill="#ffe4e6" stroke="#fb7185"/>
  <text x="236" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#9f1239">Chi phí đọc đĩa tăng tuyến tính theo kích thước bảng</text>
  <text x="236" y="378" text-anchor="middle" font-size="12" fill="#881337">Tương đương tra cứu một cuốn sách không có mục lục</text>

  <!-- Right: B-Tree Index -->
  <rect x="476" y="56" width="416" height="356" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
  <rect x="476" y="56" width="416" height="38" rx="8" fill="#d1fae5"/>
  <text x="684" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Có B-Tree Index (Cây chỉ mục đã sắp xếp)</text>

  <rect x="614" y="110" width="140" height="40" rx="6" fill="#059669"/>
  <text x="684" y="135" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Bước 1: [ 50 ]</text>

  <line x1="650" y1="150" x2="575" y2="188" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4,3"/>
  <line x1="718" y1="150" x2="788" y2="188" stroke="#059669" stroke-width="2.2" marker-end="url(#arrIdx)"/>
  <text x="795" y="170" font-size="11.5" font-weight="700" fill="#047857">85 &gt; 50 (Rẽ phải)</text>

  <rect x="515" y="192" width="115" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="572" y="216" text-anchor="middle" font-size="12.5" fill="#94a3b8">[ 20 ] (Bỏ qua)</text>

  <rect x="726" y="192" width="134" height="38" rx="6" fill="#059669"/>
  <text x="793" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Bước 2: [ 80 ]</text>

  <line x1="765" y1="230" x2="695" y2="268" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4,3"/>
  <line x1="815" y1="230" x2="835" y2="268" stroke="#059669" stroke-width="2.2" marker-end="url(#arrIdx)"/>
  <text x="852" y="254" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">85 &gt; 80</text>

  <rect x="630" y="272" width="115" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="687" y="296" text-anchor="middle" font-size="12" fill="#94a3b8">[ 60..75 ]</text>

  <rect x="760" y="272" width="118" height="38" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="819" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Bước 3: [ 85 ]</text>

  <rect x="502" y="330" width="364" height="64" rx="6" fill="#d1fae5" stroke="#34d399"/>
  <text x="684" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Chỉ cần 3 đến 4 phép so sánh (~0,1 mili-giây)</text>
  <text x="684" y="378" text-anchor="middle" font-size="12" fill="#047857">Truy cập trực tiếp tới đúng trang dữ liệu chứa bản ghi id = 85</text>
</svg>
