<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 445" width="920" height="445" font-family="Segoe UI, Roboto, DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrowStep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="916" height="441" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="460" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Hình 3.2: Thứ tự thực thi logic của câu lệnh SQL và Phân biệt GROUP BY với Window Function</text>

  <text x="460" y="60" text-anchor="middle" font-size="13" fill="#475569">Mặc dù từ khóa <tspan font-family="monospace" font-weight="700" fill="#0f172a">SELECT</tspan> viết ở đầu câu, hệ quản trị CSDL thực thi theo 7 giai đoạn sau:</text>

  <rect x="22" y="76" width="110" height="68" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="77" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">1. FROM / JOIN</text>
  <text x="77" y="118" text-anchor="middle" font-size="11.5" fill="#334155">Xác định nguồn</text>
  <text x="77" y="133" text-anchor="middle" font-size="11.5" fill="#334155">và ghép bảng</text>
  <line x1="132" y1="110" x2="148" y2="110" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowStep)"/>

  <rect x="150" y="76" width="110" height="68" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="205" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">2. WHERE</text>
  <text x="205" y="118" text-anchor="middle" font-size="11.5" fill="#334155">Lọc từng dòng</text>
  <text x="205" y="133" text-anchor="middle" font-size="11.5" fill="#92400e">(Trước gom nhóm)</text>
  <line x1="260" y1="110" x2="276" y2="110" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowStep)"/>

  <rect x="278" y="76" width="110" height="68" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="333" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">3. GROUP BY</text>
  <text x="333" y="118" text-anchor="middle" font-size="11.5" fill="#334155">Phân các dòng</text>
  <text x="333" y="133" text-anchor="middle" font-size="11.5" fill="#334155">theo từng nhóm</text>
  <line x1="388" y1="110" x2="404" y2="110" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowStep)"/>

  <rect x="406" y="76" width="110" height="68" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.6"/>
  <text x="461" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#be185d">4. HAVING</text>
  <text x="461" y="118" text-anchor="middle" font-size="11.5" fill="#334155">Lọc trên nhóm</text>
  <text x="461" y="133" text-anchor="middle" font-size="11.5" fill="#9d174d">(Sau gom nhóm)</text>
  <line x1="516" y1="110" x2="532" y2="110" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowStep)"/>

  <rect x="534" y="76" width="110" height="68" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="589" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">5. SELECT</text>
  <text x="589" y="118" text-anchor="middle" font-size="11.5" fill="#334155">Tính biểu thức</text>
  <text x="589" y="133" text-anchor="middle" font-size="11.5" fill="#334155">và đặt bí danh</text>
  <line x1="644" y1="110" x2="660" y2="110" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowStep)"/>

  <rect x="662" y="76" width="110" height="68" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="717" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">6. ORDER BY</text>
  <text x="717" y="118" text-anchor="middle" font-size="11.5" fill="#334155">Sắp xếp thứ tự</text>
  <text x="717" y="133" text-anchor="middle" font-size="11.5" fill="#334155">tăng hoặc giảm</text>
  <line x1="772" y1="110" x2="788" y2="110" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowStep)"/>

  <rect x="790" y="76" width="108" height="68" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="844" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">7. LIMIT</text>
  <text x="844" y="118" text-anchor="middle" font-size="11.5" fill="#334155">Giới hạn số</text>
  <text x="844" y="133" text-anchor="middle" font-size="11.5" fill="#334155">dòng trả về</text>

  <rect x="75" y="158" width="770" height="28" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="460" y="177" text-anchor="middle" font-size="12.5" fill="#1e40af">Hệ quả: Không thể sử dụng bí danh (Alias) khai báo ở mệnh đề <tspan font-family="monospace" font-weight="700">SELECT</tspan> (bước 5) bên trong <tspan font-family="monospace" font-weight="700">WHERE</tspan> (bước 2).</text>

  <line x1="28" y1="202" x2="892" y2="202" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="460" y="228" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e293b">So sánh trực quan: GROUP BY (Thu gọn dòng) và Window Function (Giữ nguyên số dòng)</text>

  <!-- Left: GROUP BY -->
  <rect x="28" y="244" width="418" height="178" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="237" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#047857">GROUP BY — Tổng hợp nhiều dòng thành 1 dòng</text>
  <rect x="46" y="284" width="150" height="96" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="121" y="305" text-anchor="middle" font-size="12" fill="#334155">Áo thun  | 200k</text>
  <line x1="46" y1="315" x2="196" y2="315" stroke="#e2e8f0"/>
  <text x="121" y="336" text-anchor="middle" font-size="12" fill="#334155">Quần jean | 300k</text>
  <line x1="46" y1="346" x2="196" y2="346" stroke="#e2e8f0"/>
  <text x="121" y="368" text-anchor="middle" font-size="12" fill="#334155">Mũ lưỡi  | 100k</text>
  <line x1="204" y1="332" x2="254" y2="332" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowStep)"/>
  <text x="229" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Gộp</text>
  <rect x="262" y="310" width="166" height="44" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="345" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Tổng = 600k (1 dòng)</text>
  <text x="237" y="405" text-anchor="middle" font-size="12" fill="#64748b">Áp dụng khi chỉ cần giá trị tổng hợp đại diện cho từng nhóm</text>

  <!-- Right: Window Function -->
  <rect x="474" y="244" width="418" height="178" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="683" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">Window Function (OVER) — Giữ nguyên dòng và bổ sung cột</text>
  <rect x="490" y="284" width="140" height="96" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="560" y="305" text-anchor="middle" font-size="12" fill="#334155">Áo thun | 200k</text>
  <line x1="490" y1="315" x2="630" y2="315" stroke="#e2e8f0"/>
  <text x="560" y="336" text-anchor="middle" font-size="12" fill="#334155">Quần jean | 300k</text>
  <line x1="490" y1="346" x2="630" y2="346" stroke="#e2e8f0"/>
  <text x="560" y="368" text-anchor="middle" font-size="12" fill="#334155">Mũ lưỡi | 100k</text>
  <line x1="638" y1="332" x2="678" y2="332" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowStep)"/>
  <rect x="686" y="284" width="190" height="96" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="781" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Áo thun | 200k | Hạng 2</text>
  <line x1="686" y1="315" x2="876" y2="315" stroke="#93c5fd"/>
  <text x="781" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Quần jean | 300k | Hạng 1</text>
  <line x1="686" y1="346" x2="876" y2="346" stroke="#93c5fd"/>
  <text x="781" y="368" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Mũ lưỡi | 100k | Hạng 3</text>
  <text x="683" y="405" text-anchor="middle" font-size="12" fill="#64748b">Áp dụng khi cần giữ chi tiết từng dòng đồng thời xếp hạng hoặc đối chiếu</text>
</svg>
