<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 475" width="920" height="475" font-family="Segoe UI, Roboto, DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrowFK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="916" height="471" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="460" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Hình 1.3: Liên kết qua Khóa chính (PK), Khóa ngoại (FK) và Ba loại quan hệ giữa các bảng</text>

  <!-- Left Table: users -->
  <rect x="30" y="58" width="355" height="158" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="30" y="58" width="355" height="34" rx="8" fill="#1e293b"/>
  <text x="207" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Bảng cha: users (Khách hàng)</text>
  <rect x="31" y="92" width="353" height="30" fill="#fef3c7"/>
  <text x="75" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">id (PK)</text>
  <text x="180" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">name</text>
  <text x="305" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">email (UNIQUE)</text>
  <line x1="30" y1="122" x2="385" y2="122" stroke="#cbd5e1"/>
  <rect x="38" y="128" width="74" height="26" rx="4" fill="#fde68a" stroke="#f59e0b"/>
  <text x="75" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">1</text>
  <text x="180" y="146" text-anchor="middle" font-size="13" fill="#1e293b">Phong</text>
  <text x="305" y="146" text-anchor="middle" font-size="12.5" fill="#475569">phong@mail.com</text>
  <line x1="30" y1="160" x2="385" y2="160" stroke="#e2e8f0"/>
  <text x="75" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">2</text>
  <text x="180" y="182" text-anchor="middle" font-size="13" fill="#1e293b">Linh</text>
  <text x="305" y="182" text-anchor="middle" font-size="12.5" fill="#475569">linh@mail.com</text>
  <text x="207" y="206" text-anchor="middle" font-size="11.5" fill="#64748b">PK: Định danh duy nhất, không trùng và khác NULL</text>

  <!-- Right Table: orders -->
  <rect x="535" y="58" width="355" height="158" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="535" y="58" width="355" height="34" rx="8" fill="#1e293b"/>
  <text x="712" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Bảng con: orders (Đơn hàng)</text>
  <rect x="536" y="92" width="353" height="30" fill="#dbeafe"/>
  <text x="585" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">id (PK)</text>
  <text x="705" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">user_id (FK)</text>
  <text x="828" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">amount</text>
  <line x1="535" y1="122" x2="890" y2="122" stroke="#cbd5e1"/>
  <text x="585" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">101</text>
  <rect x="668" y="128" width="74" height="26" rx="4" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="705" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">1</text>
  <text x="828" y="146" text-anchor="middle" font-size="13" fill="#1e293b">500.000đ</text>
  <line x1="535" y1="160" x2="890" y2="160" stroke="#e2e8f0"/>
  <text x="585" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">102</text>
  <rect x="668" y="164" width="74" height="26" rx="4" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="705" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">1</text>
  <text x="828" y="182" text-anchor="middle" font-size="13" fill="#1e293b">200.000đ</text>
  <text x="712" y="206" text-anchor="middle" font-size="11.5" fill="#64748b">FK: Tham chiếu tới users.id để xác định người mua</text>

  <!-- Arrow FK -> PK -->
  <path d="M 668 141 C 510 141, 495 141, 392 141" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowFK)"/>
  <path d="M 668 177 C 530 177, 505 141, 392 141" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5,4"/>
  <rect x="403" y="112" width="118" height="24" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="462" y="128" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">FK tham chiếu PK</text>

  <line x1="28" y1="236" x2="892" y2="236" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="460" y="264" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e293b">Ba loại mối quan hệ cơ bản trong thiết kế bảng</text>

  <!-- Card 1: 1-1 -->
  <rect x="28" y="282" width="272" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <rect x="28" y="282" width="272" height="34" rx="8" fill="#e0e7ff"/>
  <text x="164" y="304" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">1. Quan hệ 1 - 1 (Một - Một)</text>
  <rect x="44" y="330" width="96" height="36" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="92" y="353" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">users (1)</text>
  <line x1="140" y1="348" x2="184" y2="348" stroke="#6366f1" stroke-width="2"/>
  <rect x="184" y="330" width="102" height="36" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="235" y="353" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">profiles (1)</text>
  <text x="44" y="392" font-size="12.5" fill="#334155">• <tspan font-weight="600">Ví dụ:</tspan> 1 tài khoản ↔ 1 hồ sơ</text>
  <text x="44" y="414" font-size="12.5" fill="#334155">• <tspan font-weight="600">Thiết kế:</tspan> Cột <tspan font-family="monospace" fill="#4338ca">user_id</tspan> vừa là</text>
  <text x="56" y="434" font-size="12.5" fill="#334155">khóa ngoại (FK) vừa gắn <tspan font-family="monospace" fill="#4338ca">UNIQUE</tspan>.</text>

  <!-- Card 2: 1-N -->
  <rect x="324" y="282" width="272" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <rect x="324" y="282" width="272" height="34" rx="8" fill="#dbeafe"/>
  <text x="460" y="304" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">2. Quan hệ 1 - N (Một - Nhiều)</text>
  <rect x="342" y="330" width="94" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="389" y="353" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">users (1)</text>
  <line x1="436" y1="348" x2="482" y2="348" stroke="#2563eb" stroke-width="2"/>
  <line x1="470" y1="348" x2="482" y2="338" stroke="#2563eb" stroke-width="2"/>
  <line x1="470" y1="348" x2="482" y2="358" stroke="#2563eb" stroke-width="2"/>
  <rect x="482" y="330" width="98" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="531" y="353" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">orders (N)</text>
  <text x="340" y="392" font-size="12.5" fill="#334155">• <tspan font-weight="600">Ví dụ:</tspan> 1 khách → nhiều đơn hàng</text>
  <text x="340" y="414" font-size="12.5" fill="#334155">• <tspan font-weight="600">Thiết kế:</tspan> Đặt cột khóa ngoại</text>
  <text x="352" y="434" font-size="12.5" fill="#334155">tại bảng phía nhiều (<tspan font-family="monospace" fill="#1d4ed8">orders</tspan>).</text>

  <!-- Card 3: N-N -->
  <rect x="620" y="282" width="272" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <rect x="620" y="282" width="272" height="34" rx="8" fill="#d1fae5"/>
  <text x="756" y="304" text-anchor="middle" font-size="13.5" font-weight="700" fill="#047857">3. Quan hệ N - N (Nhiều - Nhiều)</text>
  <rect x="632" y="330" width="68" height="36" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="666" y="352" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">orders</text>
  <line x1="700" y1="348" x2="714" y2="348" stroke="#059669" stroke-width="2"/>
  <rect x="714" y="328" width="84" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="756" y="346" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">order_items</text>
  <text x="756" y="361" text-anchor="middle" font-size="10" fill="#065f46">(Trung gian)</text>
  <line x1="798" y1="348" x2="812" y2="348" stroke="#059669" stroke-width="2"/>
  <rect x="812" y="330" width="68" height="36" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="846" y="352" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">products</text>
  <text x="634" y="392" font-size="12.5" fill="#334155">• <tspan font-weight="600">Ví dụ:</tspan> Đơn hàng ↔ Sản phẩm</text>
  <text x="634" y="414" font-size="12.5" fill="#334155">• <tspan font-weight="600">Thiết kế:</tspan> Tạo bảng trung gian</text>
  <text x="646" y="434" font-size="12.5" fill="#334155">gồm 2 FK: <tspan font-family="monospace" fill="#047857">order_id, product_id</tspan>.</text>
</svg>
