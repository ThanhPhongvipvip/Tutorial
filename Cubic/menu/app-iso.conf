# Thay bằng đường dẫn đến folder custom root( trong folder mà Cubic chọn làm nơi chứa project)
ROOT="$HOME/test/custom-root"

# Khu vực staging trên Host.
STAGING="$HOME/iso-apps-staging"

# Khu vực sẽ được map vào root của ISO sau khi Cubic generate.
ISO_OVERLAY="$HOME/iso-root-overlay"

# Thay bằng đường dẫn đến folder build 
APP_BUILD_DIRS=(
    ".../.../.../build" 
)

# Bổ sung package nếu ứng dụng dùng plugin dlopen, QML, GStreamer,
# database client, codec hoặc thư viện không được ldd phát hiện.
EXTRA_APT_PACKAGES=()
